<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>laiys tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="patterns.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#080810;
  --surface:#0e0e1a;
  --card:#13131f;
  --card2:#17172a;
  --border:#1e1e32;
  --border2:#2a2a45;
  --blue:#3b82f6;
  --blue-glow:#3b82f630;
  --green:#22c55e;
  --green-dim:#16a34a;
  --green-glow:#22c55e25;
  --red:#ef4444;
  --red-dim:#b91c1c;
  --red-glow:#ef444425;
  --text:#f1f5f9;
  --muted:#64748b;
  --muted2:#94a3b8;
}
html,body{height:100%}
body{
  background:var(--bg);color:var(--text);
  font-family:'Inter',sans-serif;
  overflow:hidden;
}
body::before{
  content:'';position:fixed;inset:0;
  background-image:
    linear-gradient(rgba(59,130,246,0.03) 1px,transparent 1px),
    linear-gradient(90deg,rgba(59,130,246,0.03) 1px,transparent 1px);
  background-size:40px 40px;
  pointer-events:none;z-index:0;
}

/* NAV */
nav{
  position:relative;z-index:200;
  display:flex;align-items:center;justify-content:space-between;
  padding:0 1.5rem;height:52px;
  background:rgba(8,8,16,0.9);
  backdrop-filter:blur(16px);
  border-bottom:1px solid var(--border);
  flex-shrink:0;
}
.nav-logo{
  font-size:1rem;font-weight:800;letter-spacing:-0.02em;
  color:var(--text);display:flex;align-items:center;gap:8px;
}
.nav-logo .dot{width:7px;height:7px;border-radius:50%;background:var(--blue);animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:0.5;transform:scale(0.8)}}

.status-badge{
  display:flex;align-items:center;gap:6px;
  font-size:0.72rem;font-family:'JetBrains Mono',monospace;color:var(--muted);
}
.status-dot{width:6px;height:6px;border-radius:50%;background:var(--muted);flex-shrink:0}
.status-dot.live{background:var(--green);box-shadow:0 0 6px var(--green);animation:pulse 1.5s infinite}
.status-dot.error{background:var(--red)}

/* LAYOUT */
.app{
  display:flex;flex-direction:column;
  height:100vh;
  position:relative;z-index:1;
}
.cols{
  display:grid;
  grid-template-columns:1fr 1fr 320px;
  gap:0;
  flex:1;
  overflow:hidden;
  min-height:0;
}
.col{
  display:flex;flex-direction:column;
  border-right:1px solid var(--border);
  overflow:hidden;
  min-height:0;
}
.col:last-child{border-right:none}
.col-mid{display:flex;flex-direction:column}

/* PANEL */
.panel{
  display:flex;flex-direction:column;
  flex:1;overflow:hidden;min-height:0;
}
.panel-half{
  display:flex;flex-direction:column;
  flex:1;overflow:hidden;min-height:0;
  border-bottom:1px solid var(--border);
}
.panel-half:last-child{border-bottom:none}

.panel-header{
  display:flex;align-items:center;justify-content:space-between;
  padding:0.65rem 1rem;
  border-bottom:1px solid var(--border);
  background:rgba(13,13,31,0.6);
  flex-shrink:0;
}
.panel-title{
  font-size:0.68rem;font-weight:700;letter-spacing:0.12em;
  text-transform:uppercase;color:var(--muted2);
}
.panel-title.green{color:var(--green)}
.panel-title.red{color:var(--red)}

.live-badge{
  display:none;align-items:center;gap:5px;
  font-size:0.65rem;font-family:'JetBrains Mono',monospace;color:var(--green);
}
.live-badge.show{display:flex}
.live-dot{width:5px;height:5px;border-radius:50%;background:var(--green);animation:pulse 1.2s infinite}

.count-chip{
  font-size:0.72rem;font-weight:700;font-family:'JetBrains Mono',monospace;
  padding:2px 8px;border-radius:20px;
}
.count-chip.green{background:var(--green-glow);color:var(--green);border:1px solid var(--green-dim)}
.count-chip.red{background:var(--red-glow);color:var(--red);border:1px solid var(--red-dim)}
.count-chip.muted{background:var(--surface);color:var(--muted);border:1px solid var(--border)}

/* FEEDS */
.feed{
  flex:1;overflow-y:auto;
  padding:0.25rem 0;
  min-height:0;
}
.feed::-webkit-scrollbar{width:3px}
.feed::-webkit-scrollbar-track{background:transparent}
.feed::-webkit-scrollbar-thumb{background:var(--border2);border-radius:2px}

.msg{
  display:flex;align-items:baseline;gap:8px;
  padding:0.35rem 1rem;
  border-left:2px solid transparent;
  animation:fadeSlide 0.2s ease;
  line-height:1.4;
}
@keyframes fadeSlide{from{opacity:0;transform:translateY(3px)}to{opacity:1;transform:translateY(0)}}
.msg:hover{background:var(--card2)}
.msg.w-msg{border-left-color:var(--green)}
.msg.l-msg{border-left-color:var(--red)}

.msg-badge{
  font-size:0.58rem;font-weight:700;letter-spacing:0.06em;
  padding:1px 5px;border-radius:3px;flex-shrink:0;
}
.msg-badge.w{background:var(--green-glow);color:var(--green);border:1px solid var(--green-dim)}
.msg-badge.l{background:var(--red-glow);color:var(--red);border:1px solid var(--red-dim)}
.msg-user{font-size:0.75rem;font-weight:600;color:var(--blue);flex-shrink:0;white-space:nowrap}
.msg-text{font-size:0.75rem;color:var(--muted2);word-break:break-word;flex:1}
.msg-time{
  font-size:0.6rem;font-family:'JetBrains Mono',monospace;
  color:var(--muted);flex-shrink:0;margin-left:auto;white-space:nowrap;
}

/* LEADERBOARD (right col) */
.right-col{
  display:flex;flex-direction:column;
  overflow:hidden;min-height:0;
}
.board-half{
  display:flex;flex-direction:column;
  flex:1;overflow:hidden;min-height:0;
  border-bottom:1px solid var(--border);
}
.board-half:last-child{border-bottom:none}
.board-scroll{flex:1;overflow-y:auto;min-height:0}
.board-scroll::-webkit-scrollbar{width:3px}
.board-scroll::-webkit-scrollbar-track{background:transparent}
.board-scroll::-webkit-scrollbar-thumb{background:var(--border2);border-radius:2px}

.entry{
  display:flex;align-items:center;gap:8px;
  padding:0.45rem 1rem;
  transition:background 0.15s;
}
.entry:hover{background:var(--card2)}
.rank{font-size:0.65rem;font-weight:700;font-family:'JetBrains Mono',monospace;color:var(--muted);min-width:22px}
.rank.gold{color:#f59e0b}
.rank.silver{color:#94a3b8}
.rank.bronze{color:#b45309}
.avatar{
  width:26px;height:26px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-size:0.6rem;font-weight:700;flex-shrink:0;
}
.avatar.green{background:var(--green-glow);color:var(--green);border:1px solid var(--green-dim)}
.avatar.red{background:var(--red-glow);color:var(--red);border:1px solid var(--red-dim)}
.entry-name{flex:1;font-size:0.8rem;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.entry-score{font-size:0.8rem;font-weight:700;font-family:'JetBrains Mono',monospace}
.entry-score.green{color:var(--green)}
.entry-score.red{color:var(--red)}

.board-empty{padding:1.5rem;text-align:center;font-size:0.75rem;color:var(--muted)}

/* RESET BTN */
.btn-reset{
  background:transparent;border:1px solid var(--border2);
  color:var(--muted);padding:2px 8px;border-radius:6px;
  font-size:0.65rem;cursor:pointer;font-family:'Inter',sans-serif;
  transition:all 0.15s;
}
.btn-reset:hover{border-color:var(--border2);color:var(--text);background:var(--card2)}

/* TOAST */
.toast{
  position:fixed;bottom:1.5rem;right:1.5rem;z-index:999;
  background:var(--card);border:1px solid var(--border2);
  padding:0.65rem 1.1rem;border-radius:10px;
  font-size:0.8rem;color:var(--text);
  box-shadow:0 8px 32px rgba(0,0,0,0.5);
  transform:translateY(8px);opacity:0;
  transition:all 0.25s;pointer-events:none;
}
.toast.show{transform:translateY(0);opacity:1}

/* RESPONSIVE */
@media(max-width:900px){
  body{overflow:auto}
  .cols{grid-template-columns:1fr;height:auto}
  .col,.panel,.panel-half,.board-half{min-height:320px}
  .feed,.board-scroll{max-height:320px}
}
</style>
</head>
<body>

<div class="app">
  <nav>
    <div class="nav-logo">
      <span class="dot"></span>
      laiys tracker
    </div>
    <div class="status-badge">
      <span class="status-dot" id="statusDot"></span>
      <span id="statusText">connecting...</span>
    </div>
  </nav>

  <div class="cols">

    <!-- LEFT: Live Chat (all messages, direct Twitch IRC) -->
    <div class="col">
      <div class="panel">
        <div class="panel-header">
          <span class="panel-title">live chat</span>
          <span class="live-badge" id="liveBadge">
            <span class="live-dot"></span> live
          </span>
        </div>
        <div class="feed" id="chatFeed">
          <div class="board-empty">connecting to stableronaldo's chat...</div>
        </div>
      </div>
    </div>

    <!-- MIDDLE: W feed + L feed (from Supabase real-time) -->
    <div class="col col-mid">
      <div class="panel-half">
        <div class="panel-header">
          <span class="panel-title green">W laiys</span>
          <span class="count-chip green" id="wTotal">—</span>
        </div>
        <div class="feed" id="wFeed">
          <div class="board-empty">loading...</div>
        </div>
      </div>
      <div class="panel-half">
        <div class="panel-header">
          <span class="panel-title red">L laiys</span>
          <span class="count-chip red" id="lTotal">—</span>
        </div>
        <div class="feed" id="lFeed">
          <div class="board-empty">loading...</div>
        </div>
      </div>
    </div>

    <!-- RIGHT: Leaderboard (from Supabase) -->
    <div class="col right-col">
      <div class="board-half">
        <div class="panel-header">
          <span class="panel-title green">top glazers</span>
          <div style="display:flex;gap:6px;align-items:center">
            <span class="count-chip muted" id="wBoardCount">—</span>
          </div>
        </div>
        <div class="board-scroll">
          <div id="wBoard"><div class="board-empty">loading...</div></div>
        </div>
      </div>
      <div class="board-half">
        <div class="panel-header">
          <span class="panel-title red">top haters</span>
          <span class="count-chip muted" id="lBoardCount">—</span>
        </div>
        <div class="board-scroll">
          <div id="lBoard"><div class="board-empty">loading...</div></div>
        </div>
      </div>
    </div>

  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ─── Supabase ─────────────────────────────────────────────
const SUPABASE_URL  = 'https://zglvndxmvmfzaxrlhoht.supabase.co';
const SUPABASE_ANON = 'sb_publishable_zHmNrleng6boCU5HRfKANA_s60bwOEo';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON);
console.log('[supabase] client created');

// ─── State ────────────────────────────────────────────────
let ws = null;
let connected = false;
let chatEmpty = true;

// ─── Supabase: initial load + real-time ──────────────────
async function initSupabase() {
  await Promise.all([
    loadFeed('w'),
    loadFeed('l'),
    refreshLeaderboard(),
  ]);

  // Real-time: new mention inserted by bot.js
  sb.channel('mentions-rt')
    .on('postgres_changes', {
      event: 'INSERT',
      schema: 'public',
      table: 'mentions',
    }, (payload) => {
      console.log('[supabase] realtime INSERT received:', payload);
      const row = payload.new;
      const t = formatTime(row.created_at);
      prependMsg(row.type === 'w' ? 'wFeed' : 'lFeed', row.username, row.message, row.type, t);
      refreshLeaderboard();
    })
    .subscribe((status, err) => {
      console.log('[supabase] subscription status:', status, err || '');
    });
}

async function loadFeed(type) {
  const feedId = type === 'w' ? 'wFeed' : 'lFeed';
  console.log(`[supabase] loadFeed(${type}) — querying...`);
  const { data, error } = await sb
    .from('mentions')
    .select('username, message, created_at')
    .eq('type', type)
    .order('created_at', { ascending: false })
    .limit(60);

  const feed = document.getElementById(feedId);

  if (error) {
    console.error(`[supabase] loadFeed(${type}) error:`, error.message, '| code:', error.code, '| hint:', error.hint);
    feed.innerHTML = `<div class="board-empty">error loading feed — check console</div>`;
    return;
  }

  console.log(`[supabase] loadFeed(${type}) got ${data?.length ?? 0} rows`);

  if (!data?.length) {
    feed.innerHTML = `<div class="board-empty">no ${type === 'w' ? 'W' : 'L'}'s yet</div>`;
    return;
  }

  feed.innerHTML = '';
  data.forEach(row => {
    appendMsgBottom(feedId, row.username, row.message, type, formatTime(row.created_at));
  });
}

async function refreshLeaderboard() {
  console.log('[supabase] refreshLeaderboard — calling RPC...');
  const [wRes, lRes] = await Promise.all([
    sb.rpc('get_leaderboard', { mention_type: 'w', lim: 15 }),
    sb.rpc('get_leaderboard', { mention_type: 'l', lim: 15 }),
  ]);

  if (wRes.error) console.error('[supabase] get_leaderboard(w) error:', wRes.error.message, '| code:', wRes.error.code, '| hint:', wRes.error.hint);
  if (lRes.error) console.error('[supabase] get_leaderboard(l) error:', lRes.error.message, '| code:', lRes.error.code, '| hint:', lRes.error.hint);

  console.log('[supabase] leaderboard W rows:', wRes.data?.length ?? 0, '| L rows:', lRes.data?.length ?? 0);

  renderBoardData('w', wRes.data || []);
  renderBoardData('l', lRes.data || []);
}

function renderBoardData(type, rows) {
  const el    = document.getElementById(type === 'w' ? 'wBoard' : 'lBoard');
  const total = document.getElementById(type === 'w' ? 'wTotal' : 'lTotal');
  const count = document.getElementById(type === 'w' ? 'wBoardCount' : 'lBoardCount');
  const cls   = type === 'w' ? 'green' : 'red';

  const sum = rows.reduce((acc, r) => acc + Number(r.mentions), 0);
  total.textContent = sum;
  count.textContent = rows.length;

  if (!rows.length) {
    el.innerHTML = '<div class="board-empty">no data yet</div>';
    return;
  }

  const rankClasses = ['gold', 'silver', 'bronze'];
  el.innerHTML = rows.map((r, i) => `
    <div class="entry">
      <span class="rank ${rankClasses[i] || ''}">#${i + 1}</span>
      <div class="avatar ${cls}">${esc(r.username).slice(0, 2).toUpperCase()}</div>
      <span class="entry-name">${esc(r.username)}</span>
      <span class="entry-score ${cls}">${r.mentions}</span>
    </div>`).join('');
}

// ─── Twitch IRC (left panel: all messages) ───────────────
function connect(channel) {
  setStatus('connecting', 'connecting...');
  ws = new WebSocket('wss://irc-ws.chat.twitch.tv:443');

  ws.onopen = () => {
    ws.send('CAP REQ :twitch.tv/tags twitch.tv/commands');
    const id = Math.floor(Math.random() * 89999) + 10000;
    ws.send(`PASS oauth:justinfan${id}`);
    ws.send(`NICK justinfan${id}`);
    ws.send(`JOIN #${channel}`);
  };

  ws.onmessage = (e) => {
    const lines = e.data.split('\r\n');
    for (const line of lines) {
      const raw = line.trim();
      if (!raw) continue;
      if (raw.startsWith('PING')) { ws.send('PONG :tmi.twitch.tv'); continue; }
      if (raw.includes(':tmi.twitch.tv 001') || raw.includes('End of /NAMES list')) {
        connected = true;
        setStatus('live', channel);
        document.getElementById('liveBadge').classList.add('show');
      }
      parseChatLine(raw);
    }
  };

  ws.onerror = () => setStatus('error', 'connection error');
  ws.onclose = () => {
    if (connected) setStatus('error', 'disconnected');
    connected = false;
    document.getElementById('liveBadge').classList.remove('show');
  };
}

function parseChatLine(raw) {
  let displayName = null;
  if (raw.startsWith('@')) {
    const tags = raw.slice(1, raw.indexOf(' '));
    const dn = tags.match(/display-name=([^;]+)/);
    if (dn && dn[1]) displayName = dn[1];
  }

  const match = raw.match(/:([^!]+)![^\s]+ PRIVMSG #[^\s]+ :(.+)/);
  if (!match) return;

  const user = displayName || match[1];
  const text = match[2].trim();
  if (!text) return;

  const result = TrackerPatterns.classify(text);
  const t = formatTime(new Date().toISOString());

  // All messages → left chat feed
  prependMsg('chatFeed', user, text, result.type, t, true);
}

// ─── Feed helpers ─────────────────────────────────────────
function prependMsg(feedId, user, text, type, t, isChatFeed) {
  const feed = document.getElementById(feedId);
  if (isChatFeed && chatEmpty) { feed.innerHTML = ''; chatEmpty = false; }
  else if (!isChatFeed && feed.querySelector('.board-empty')) feed.innerHTML = '';

  const div = document.createElement('div');
  div.className = type ? `msg ${type}-msg` : 'msg';
  div.innerHTML = (type && isChatFeed)
    ? `<span class="msg-badge ${type}">${type.toUpperCase()}</span><span class="msg-user">${esc(user)}</span><span class="msg-text">${esc(text)}</span><span class="msg-time">${t}</span>`
    : `<span class="msg-user">${esc(user)}</span><span class="msg-text">${esc(text)}</span><span class="msg-time">${t}</span>`;

  if (isChatFeed) {
    // Chat: newest at bottom, auto-scroll down
    feed.appendChild(div);
    while (feed.children.length > 150) feed.removeChild(feed.firstChild);
    requestAnimationFrame(() => { feed.scrollTop = feed.scrollHeight; });
  } else {
    // W/L feeds: newest at top
    feed.insertBefore(div, feed.firstChild);
    while (feed.children.length > 150) feed.removeChild(feed.lastChild);
  }
}

// Append (for historical load, newest already at top from query)
function appendMsgBottom(feedId, user, text, type, t) {
  const feed = document.getElementById(feedId);
  const div = document.createElement('div');
  div.className = `msg ${type}-msg`;
  div.innerHTML = `<span class="msg-user">${esc(user)}</span><span class="msg-text">${esc(text)}</span><span class="msg-time">${t}</span>`;
  feed.appendChild(div);
}

// ─── Status ──────────────────────────────────────────────
function setStatus(state, msg) {
  const dot = document.getElementById('statusDot');
  const txt = document.getElementById('statusText');
  dot.className = 'status-dot' + (state === 'live' ? ' live' : state === 'error' ? ' error' : '');
  txt.textContent = msg;
}

// ─── Toast ───────────────────────────────────────────────
function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 2500);
}

// ─── Utils ───────────────────────────────────────────────
function esc(s) {
  return String(s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;')
    .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function formatTime(iso) {
  return new Date(iso).toLocaleTimeString([], {
    hour: '2-digit', minute: '2-digit', second: '2-digit'
  });
}

// ─── Boot ─────────────────────────────────────────────────
initSupabase();
connect('stableronaldo');
</script>
</body>
</html>

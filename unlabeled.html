<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>laiys tracker — label queue</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#080810;
  --surface:#0e0e1a;
  --card:#13131f;
  --border:#1e1e32;
  --border2:#2a2a45;
  --blue:#3b82f6;
  --green:#22c55e;
  --green-glow:#22c55e25;
  --red:#ef4444;
  --red-glow:#ef444425;
  --text:#f1f5f9;
  --muted:#64748b;
  --muted2:#94a3b8;
}
html,body{height:100%;overflow:hidden}
body{
  background:var(--bg);color:var(--text);
  font-family:'Inter',sans-serif;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
}
body::before{
  content:'';position:fixed;inset:0;
  background-image:
    linear-gradient(rgba(59,130,246,0.03) 1px,transparent 1px),
    linear-gradient(90deg,rgba(59,130,246,0.03) 1px,transparent 1px);
  background-size:40px 40px;
  pointer-events:none;z-index:0;
}

nav{
  position:fixed;top:0;left:0;right:0;z-index:200;
  display:flex;align-items:center;justify-content:space-between;
  padding:0 1.5rem;height:52px;
  background:rgba(8,8,16,0.9);
  backdrop-filter:blur(16px);
  border-bottom:1px solid var(--border);
}
.nav-logo{font-size:1rem;font-weight:800;letter-spacing:-0.02em;color:var(--text)}
.nav-logo span{color:var(--blue)}
.nav-meta{font-size:0.72rem;font-family:'JetBrains Mono',monospace;color:var(--muted)}

.wrap{
  position:relative;z-index:1;
  width:100%;max-width:560px;
  padding:0 1.5rem;
  display:flex;flex-direction:column;align-items:center;gap:1.5rem;
}

.progress{
  font-size:0.72rem;font-family:'JetBrains Mono',monospace;
  color:var(--muted);letter-spacing:0.06em;
}

.card{
  width:100%;
  background:var(--card);
  border:1px solid var(--border);
  border-radius:12px;
  padding:2rem;
  display:flex;flex-direction:column;gap:1rem;
}

.card-meta{
  display:flex;align-items:center;gap:0.5rem;
  font-size:0.7rem;font-family:'JetBrains Mono',monospace;color:var(--muted);
}
.avatar{
  width:22px;height:22px;border-radius:4px;
  background:var(--border2);
  display:flex;align-items:center;justify-content:center;
  font-size:0.6rem;font-weight:700;color:var(--muted2);
  flex-shrink:0;
}

.message{
  font-size:1.15rem;font-weight:500;line-height:1.5;
  color:var(--text);word-break:break-word;
}

.buttons{
  display:flex;gap:0.75rem;margin-top:0.5rem;
}
button{
  flex:1;padding:0.75rem 1rem;
  border:none;border-radius:8px;
  font-family:'Inter',sans-serif;font-size:0.9rem;font-weight:700;
  cursor:pointer;transition:opacity 0.15s,transform 0.1s;
  letter-spacing:0.04em;
}
button:active{transform:scale(0.97)}
button:disabled{opacity:0.4;cursor:not-allowed}

.btn-w{
  background:var(--green);color:#000;
}
.btn-w:hover:not(:disabled){background:#16c95a}
.btn-l{
  background:var(--red);color:#fff;
}
.btn-l:hover:not(:disabled){background:#d93c3c}
.btn-skip{
  flex:0 0 auto;padding:0.75rem 1.25rem;
  background:var(--border);color:var(--muted2);
}
.btn-skip:hover:not(:disabled){background:var(--border2)}

.empty{
  text-align:center;
  font-size:0.9rem;color:var(--muted);
  display:flex;flex-direction:column;gap:0.5rem;
  align-items:center;
}
.empty strong{font-size:1.1rem;color:var(--muted2)}

.toast{
  position:fixed;bottom:1.5rem;left:50%;transform:translateX(-50%);
  background:var(--border2);color:var(--text);
  font-size:0.8rem;font-family:'JetBrains Mono',monospace;
  padding:0.5rem 1rem;border-radius:6px;
  opacity:0;transition:opacity 0.2s;
  pointer-events:none;z-index:300;white-space:nowrap;
}
.toast.show{opacity:1}
</style>
</head>
<body>

<nav>
  <div class="nav-logo">laiys<span>.</span>tracker <span style="font-size:0.7rem;font-weight:500;color:var(--muted);margin-left:6px;font-family:'JetBrains Mono',monospace;">/ label queue</span></div>
  <div class="nav-meta" id="navMeta">loading…</div>
</nav>

<div class="wrap">
  <div class="progress" id="progress"></div>

  <div class="card" id="card">
    <div class="empty"><strong>loading…</strong></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const SUPABASE_URL  = 'https://zglvndxmvmfzaxrlhoht.supabase.co';
const SUPABASE_ANON = 'sb_publishable_zHmNrleng6boCU5HRfKANA_s60bwOEo';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON);

let queue = [];   // unlabeled rows, oldest first
let idx   = 0;   // current position in queue
let total = 0;   // total unlabeled at load time

async function load() {
  const { data, error, count } = await sb
    .from('unlabeled_messages')
    .select('*', { count: 'exact' })
    .eq('labeled', false)
    .order('created_at', { ascending: true })
    .limit(200);

  if (error) {
    showCard(null, `Error loading: ${error.message}`);
    return;
  }

  queue = data || [];
  total = count || queue.length;
  idx   = 0;
  render();
}

function render() {
  const meta = document.getElementById('navMeta');
  const prog = document.getElementById('progress');

  const remaining = queue.length - idx;
  meta.textContent = `${remaining} unlabeled`;
  prog.textContent = remaining > 0
    ? `${idx + 1} / ${queue.length} in this batch`
    : '';

  if (remaining === 0) {
    showEmpty();
    return;
  }

  const row = queue[idx];
  showCard(row);
}

function showCard(row, errMsg) {
  const card = document.getElementById('card');
  if (!row) {
    card.innerHTML = `<div class="empty"><strong>${errMsg || 'all done!'}</strong><span>Nothing left to label.</span></div>`;
    return;
  }

  const initials = (row.username || '?').slice(0, 2).toUpperCase();
  const time = new Date(row.created_at).toLocaleString();

  card.innerHTML = `
    <div class="card-meta">
      <div class="avatar">${esc(initials)}</div>
      <span>${esc(row.username)}</span>
      <span style="margin-left:auto">${esc(time)}</span>
    </div>
    <div class="message">${esc(row.message)}</div>
    <div class="buttons">
      <button class="btn-w" id="btnW">W</button>
      <button class="btn-l" id="btnL">L</button>
      <button class="btn-skip" id="btnSkip">Skip</button>
    </div>
  `;

  document.getElementById('btnW').addEventListener('click', () => label(row, 'w'));
  document.getElementById('btnL').addEventListener('click', () => label(row, 'l'));
  document.getElementById('btnSkip').addEventListener('click', skip);
}

function showEmpty() {
  document.getElementById('card').innerHTML = `
    <div class="empty">
      <strong>all caught up</strong>
      <span>No unlabeled messages right now.</span>
    </div>`;
  document.getElementById('progress').textContent = '';
}

async function label(row, lbl) {
  setButtons(true);

  // Insert into training_data
  const { error: tdErr } = await sb
    .from('training_data')
    .insert({ username: row.username, message: row.message, label: lbl, source_id: row.id });

  if (tdErr) {
    toast(`insert error: ${tdErr.message}`, 3000);
    setButtons(false);
    return;
  }

  // Mark as labeled in unlabeled_messages
  const { error: ulErr } = await sb
    .from('unlabeled_messages')
    .update({ labeled: true })
    .eq('id', row.id);

  if (ulErr) console.warn('[label] could not mark labeled:', ulErr.message);

  toast(lbl === 'w' ? 'saved W' : 'saved L');
  next();
}

function skip() {
  toast('skipped');
  next();
}

function next() {
  idx++;
  render();
}

function setButtons(disabled) {
  ['btnW', 'btnL', 'btnSkip'].forEach(id => {
    const el = document.getElementById(id);
    if (el) el.disabled = disabled;
  });
}

let toastTimer = null;
function toast(msg, duration = 1200) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), duration);
}

function esc(str) {
  return String(str ?? '')
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;');
}

load();
</script>
</body>
</html>
